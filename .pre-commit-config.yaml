# Local hooks only: no third-party hook repositories are fetched.
# Install once with `pre-commit install` (see DEV.md).
repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt -s
        description: Format staged Go files (same flags as `make fmt`). A reformat fails the commit; re-add and commit again.
        entry: gofmt -s -w -e
        language: system
        types: [go]

      - id: generate-docs
        name: make generate (docs and examples)
        description: Regenerate docs when provider, example or tools sources change (including deletions), so the CI pre-commit job stays clean.
        entry: scripts/pre-commit-generate.sh
        language: system
        pass_filenames: false
        # Always run: deletions are not passed to hooks, so the script inspects the staged names itself.
        always_run: true
