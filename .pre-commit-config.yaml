# Local hooks only: no third-party hook repositories are fetched.
# Install once with `pre-commit install` (see DEV.md).
repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt -s
        description: Format staged Go files (same flags as `make fmt`). A reformat fails the commit; re-add and commit again.
        entry: gofmt -s -w -e
        language: system
        types: [go]

      - id: generate-docs
        name: make generate (docs and examples)
        description: Regenerate docs and examples so the CI pre-commit job stays clean. A change to generated files fails the commit; re-add and commit again.
        entry: make generate
        language: system
        pass_filenames: false
        always_run: true
